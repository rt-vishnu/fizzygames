<!doctype html>
<html lang="en" data-game="court-clash">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Court Clash</title>
<link rel="stylesheet" href="../_shared/arcade.css" />
<style>
  :root { --g1: #ffd11a; --g2: #2ead4b; }
  .pp-stage canvas { box-shadow: 0 12px 40px rgba(14, 15, 12, .10); }
</style>
</head>
<body>
<div class="pp-stage"><canvas id="c"></canvas></div>

<div class="pp-touch" id="touch">
  <div class="cluster"><button id="tl">◀</button><button id="tr">▶</button></div>
</div>

<div class="pp-overlay" id="overlay">
  <div>
    <h1 class="pp-title">Court Clash</h1>
    <p class="pp-sub" id="msg">First to 5 games wins the set. Keep the rally alive.</p>
    <p class="pp-sub">
      <span class="pp-kbd">←</span><span class="pp-kbd">→</span> / drag to move · swing at the ball
    </p>
    <div id="finalStats"></div>
    <p></p>
    <button class="pp-btn" id="go">Serve</button>
  </div>
</div>

<script src="../_shared/playpit.js"></script>
<script>
(function () {
  "use strict";
  var P = window.Playpit;
  var W = 480, H = 720;
  var NET_Y = H / 2, NET_H = 46; // net rises this high in "z" units

  var canvas = document.getElementById("c");
  var ctx = P.fit(canvas, W, H);
  var sfx = P.audio();
  var input = P.input();

  if (P.isTouch) {
    document.getElementById("touch").classList.add("on");
    input.bind(document.getElementById("tl"), "left");
    input.bind(document.getElementById("tr"), "right");
  }

  P.hud({ you: "You", ai: "Rival", rally: "Rally", games: "Games" });

  var player, rival, ball;
  var youPts, aiPts, youGames, aiGames, rally, bestRally, hits;
  var running, serving, serveTimer, pointerX, particles;

  canvas.addEventListener("pointermove", function (e) {
    var r = canvas.getBoundingClientRect();
    pointerX = ((e.clientX - r.left) / r.width) * W;
  });
  canvas.addEventListener("touchmove", function (e) {
    if (!e.touches[0]) return;
    var r = canvas.getBoundingClientRect();
    pointerX = ((e.touches[0].clientX - r.left) / r.width) * W;
    e.preventDefault();
  }, { passive: false });

  function reset() {
    player = { x: W / 2, y: H - 70, speed: 380, swingT: 0 };
    rival = { x: W / 2, y: 70, speed: 210, swingT: 0 };
    youPts = 0; aiPts = 0; youGames = 0; aiGames = 0;
    rally = 0; bestRally = 0; hits = 0;
    particles = [];
    running = true;
    serveToPlayer(true);
    syncHUD();
  }

  function syncHUD() {
    P.set({
      you: String(youPts),
      ai: String(aiPts),
      rally: String(rally),
      games: youGames + "–" + aiGames
    });
  }

  /**
   * The ball carries a ground position (x,y) plus a height "z" that gives
   * it gravity and a real bounce -- this is the single thing that makes it
   * read as tennis instead of two paddles batting a puck in a straight
   * line. Contact only counts near z=0 (racket height), and the ball must
   * bounce once on each side between hits, same as the real game.
   */
  function serveToPlayer(playerServe) {
    serving = true;
    serveTimer = 0.55;
    ball = {
      x: W / 2, y: playerServe ? H - 130 : 130,
      z: 0, vx: 0, vy: 0, vz: 0,
      vgx: P.rand(-30, 30), vgy: playerServe ? -300 : 300,
      lastHit: playerServe ? "player" : "ai",
      bounces: 0, sideAtServe: playerServe ? "far" : "near",
      trail: []
    };
  }

  function launchServe() {
    ball.vx = ball.vgx;
    ball.vy = ball.vgy;
    // A baseline-to-baseline shot covers ~580 units at ~300/s (~1.9s in the
    // air); this vz peaks near mid-flight, comfortably clearing NET_H (46)
    // at the net crossing rather than netting out before either player can
    // touch it.
    ball.vz = 430;
    ball.bounces = 0;
  }

  var GRAVITY = 620;

  function hitBall(pad, isPlayer) {
    var offset = P.clamp((ball.x - pad.x) / 44, -1, 1);
    var power = 300 + Math.min(170, rally * 9);
    ball.vx = offset * 230 + P.rand(-15, 15);
    ball.vy = (isPlayer ? -1 : 1) * power;
    ball.vz = 400 + Math.min(90, rally * 4);
    ball.lastHit = isPlayer ? "player" : "ai";
    ball.bounces = 0;
    pad.swingT = 0.18;
    hits++;
    rally++;
    if (rally > bestRally) bestRally = rally;
    if (rally >= 12) P.achieve("rally-12", "Long Game", "Hold a 12-shot rally");
    sfx.play(isPlayer ? 660 : 520, 0.05, "triangle", 0.04);
    syncHUD();
  }

  function point(toPlayer) {
    if (toPlayer) youPts++; else aiPts++;
    rally = 0;
    sfx.play(toPlayer ? 880 : 180, 0.12, toPlayer ? "square" : "sawtooth", 0.05);
    syncHUD();

    if (youPts >= 4 && youPts - aiPts >= 2) {
      youGames++; youPts = 0; aiPts = 0;
      P.toast("🎾", "Game", "You " + youGames + "–" + aiGames);
      if (youGames >= 3) P.achieve("games-3", "Set Point Pressure", "Win 3 games in a set");
    } else if (aiPts >= 4 && aiPts - youPts >= 2) {
      aiGames++; youPts = 0; aiPts = 0;
      P.toast("🎾", "Game rival", "You " + youGames + "–" + aiGames);
    }

    if (youGames >= 5 || aiGames >= 5) { endSet(); return; }
    serveToPlayer(toPlayer);
  }

  function endSet() {
    running = false;
    loop.stop();
    var score = youGames * 1000 + youPts * 50 + bestRally * 10 + hits;
    var won = youGames > aiGames;
    if (won) P.achieve("set-win", "Set Winner", "Win a set of Court Clash");
    var res = P.run(score, { games: youGames + "-" + aiGames, rally: bestRally });
    document.querySelector("#overlay .pp-title").textContent = won ? "You take the set" : "Set lost";
    document.getElementById("msg").textContent = res.isBest
      ? "New personal best." : "Best so far: " + P.commas(res.best) + ".";
    document.getElementById("finalStats").innerHTML =
      '<div class="pp-stats">' +
      '<div><span>Score</span><b>' + P.commas(score) + '</b></div>' +
      '<div><span>Games</span><b>' + youGames + "–" + aiGames + '</b></div>' +
      '<div><span>Best rally</span><b>' + bestRally + '</b></div>' +
      '<div><span>Best</span><b>' + P.commas(res.best) + '</b></div>' +
      "</div>";
    document.getElementById("go").textContent = "Play again";
    document.getElementById("overlay").hidden = false;
  }

  function burst(x, y, color) {
    for (var i = 0; i < 10; i++) {
      particles.push({
        x: x, y: y, vx: P.rand(-90, 90), vy: P.rand(-90, 90),
        life: 0.35, max: 0.35, color: color
      });
    }
  }

  function step(dt) {
    if (!running) return;

    var move = 0;
    if (input.down("left")) move -= 1;
    if (input.down("right")) move += 1;
    if (typeof pointerX === "number") {
      player.x = P.lerp(player.x, pointerX, Math.min(1, dt * 14));
    } else {
      player.x += move * player.speed * dt;
    }
    player.x = P.clamp(player.x, 34, W - 34);
    if (player.swingT > 0) player.swingT -= dt;
    if (rival.swingT > 0) rival.swingT -= dt;

    var aim = ball.x + ball.vx * 0.1;
    var skill = 0.55 + Math.min(0.3, aiGames * 0.04);
    rival.x = P.lerp(rival.x, aim, skill * dt * 6);
    rival.x = P.clamp(rival.x, 34, W - 34);
    rival.speed = 190 + youGames * 18;

    if (serving) {
      serveTimer -= dt;
      ball.x = P.lerp(ball.x, ball.sideAtServe === "far" ? player.x : rival.x, dt * 4);
      if (serveTimer > 0) return;
      serving = false;
      launchServe();
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.vz -= GRAVITY * dt;
    ball.z += ball.vz * dt;

    ball.trail.push({ x: ball.x, y: ball.y, z: ball.z });
    if (ball.trail.length > 6) ball.trail.shift();

    if (ball.x < 26) { ball.x = 26; ball.vx *= -1; }
    if (ball.x > W - 26) { ball.x = W - 26; ball.vx *= -1; }

    // Net: only a physical obstacle near the ground and near the middle line.
    var crossingNet = (ball.y - ball.vy * dt < NET_Y) !== (ball.y < NET_Y);
    if (crossingNet && ball.z < NET_H) {
      ball.vy *= -0.35;
      ball.y += ball.vy * dt * 3;
      burst(ball.x, NET_Y, "#e2e2e2");
      sfx.play(150, 0.06, "triangle", 0.03);
    }

    // Ground bounce
    if (ball.z <= 0 && ball.vz < 0) {
      ball.z = 0;
      ball.vz *= -0.62;
      ball.bounces++;
      burst(ball.x, ball.y, "rgba(255,255,255,.7)");
      sfx.play(300, 0.04, "sine", 0.02);

      var onFarSide = ball.y < NET_Y; // rival's side
      if (ball.bounces >= 2) {
        point(onFarSide); // it bounced twice on their side -> point to the other player
        return;
      }
    }

    // Contact: only registers close to racket height, once per side per pass.
    var atPlayerHeight = ball.z < 70 && ball.vy > 0;
    var atRivalHeight = ball.z < 70 && ball.vy < 0;

    if (atPlayerHeight && ball.lastHit !== "player" &&
        ball.y > player.y - 30 && ball.y < player.y + 16 &&
        Math.abs(ball.x - player.x) < 46) {
      hitBall(player, true);
    } else if (atRivalHeight && ball.lastHit !== "ai" &&
        ball.y < rival.y + 30 && ball.y > rival.y - 16 &&
        Math.abs(ball.x - rival.x) < 46) {
      hitBall(rival, false);
    }

    // Missed entirely: ball travels past a player's baseline without contact.
    if (ball.y > H + 24) point(false);
    if (ball.y < -24) point(true);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawCourt() {
    ctx.fillStyle = "#2ead4b";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#278a3d";
    ctx.fillRect(24, 24, W - 48, H - 48);

    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 3;
    ctx.strokeRect(36, 36, W - 72, H - 72);
    ctx.beginPath();
    ctx.moveTo(W / 2, 36); ctx.lineTo(W / 2, H - 36);
    ctx.moveTo(36, H / 2); ctx.lineTo(W - 36, H / 2);
    ctx.moveTo(36, H * 0.28); ctx.lineTo(W - 36, H * 0.28);
    ctx.moveTo(36, H * 0.72); ctx.lineTo(W - 36, H * 0.72);
    ctx.stroke();

    // Net with posts -- drawn tall so the ball can visibly clip it.
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillRect(30, NET_Y - 3, W - 60, 6);
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 2;
    for (var nx = 34; nx <= W - 34; nx += 12) {
      ctx.beginPath();
      ctx.moveTo(nx, NET_Y - NET_H * 0.45);
      ctx.lineTo(nx, NET_Y + 3);
      ctx.stroke();
    }
    ctx.fillStyle = "#0e0f0c";
    ctx.fillRect(26, NET_Y - NET_H * 0.45 - 2, 4, NET_H * 0.45 + 8);
    ctx.fillRect(W - 30, NET_Y - NET_H * 0.45 - 2, 4, NET_H * 0.45 + 8);
  }

  function drawPlayer(p, shirt, facingDown) {
    var swing = p.swingT > 0;
    ctx.save();
    ctx.translate(p.x, p.y);
    // Shadow
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.beginPath();
    ctx.ellipse(0, 22, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Legs
    ctx.strokeStyle = "#0e0f0c";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-6, 10); ctx.lineTo(-10, 24);
    ctx.moveTo(6, 10); ctx.lineTo(10, 24);
    ctx.stroke();
    // Body
    ctx.fillStyle = shirt;
    P.roundRect(ctx, -13, -8, 26, 22, 8);
    ctx.fill();
    // Head
    ctx.fillStyle = "#ffc091";
    ctx.beginPath();
    ctx.arc(0, -16, 9, 0, Math.PI * 2);
    ctx.fill();
    // Racket -- swings out to the side on contact
    ctx.save();
    var reach = swing ? 1 : 0.4;
    ctx.rotate((facingDown ? 1 : -1) * (swing ? -0.9 : -0.3));
    ctx.strokeStyle = "#4a3b1c";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(14 + 16 * reach, (facingDown ? 1 : -1) * 4);
    ctx.stroke();
    ctx.strokeStyle = "#e8ebe6";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(14 + 20 * reach, (facingDown ? 1 : -1) * 4, 8, 10, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  function render() {
    drawCourt();
    drawPlayer(rival, "#ffc091", true);
    drawPlayer(player, "#ffd11a", false);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (ball) {
      // Trail
      for (var t = 0; t < ball.trail.length; t++) {
        var tp = ball.trail[t];
        ctx.globalAlpha = (t / ball.trail.length) * 0.35;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(tp.x, tp.y - tp.z * 0.55, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Ground shadow shrinks/moves independent of the ball -- this is the
      // cue that reads as height rather than the ball just being "up".
      var shadowScale = P.clamp(1 - ball.z / 260, 0.25, 1);
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.beginPath();
      ctx.ellipse(ball.x, ball.y, 7 * shadowScale, 3 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f4f455";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y - ball.z * 0.55, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#dcd400";
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    if (serving) {
      ctx.fillStyle = "rgba(14,15,12,0.5)";
      ctx.font = "800 18px system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Ready…", W / 2, H / 2 - 16);
      ctx.textAlign = "left";
    }
  }

  var loop = P.loop(step, render);

  document.getElementById("go").addEventListener("click", function () {
    document.getElementById("overlay").hidden = true;
    pointerX = undefined;
    reset();
    loop.start();
  });
})();
</script>
</body>
</html>
