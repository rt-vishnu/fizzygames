<!doctype html>
<html lang="en" data-game="boundary-bash">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Boundary Bash</title>
<link rel="stylesheet" href="../_shared/arcade.css" />
<style>
  :root { --g1: #2ead4b; --g2: #054d28; }
  .pp-stage canvas { box-shadow: 0 12px 40px rgba(14, 15, 12, .10); }
</style>
</head>
<body>
<div class="pp-stage"><canvas id="c"></canvas></div>

<div class="pp-touch" id="touch">
  <div class="cluster"><button id="swing">🏏 Swing</button></div>
</div>

<div class="pp-overlay" id="overlay">
  <div>
    <h1 class="pp-title">Boundary Bash</h1>
    <p class="pp-sub" id="msg">Time your swing. Ones, fours, sixes — don't get bowled.</p>
    <p class="pp-sub">
      <span class="pp-kbd">space</span> / click to swing · three wickets
    </p>
    <div id="finalStats"></div>
    <p></p>
    <button class="pp-btn" id="go">Bat</button>
  </div>
</div>

<script src="../_shared/playpit.js"></script>
<script>
(function () {
  "use strict";
  var P = window.Playpit;
  var W = 640, H = 480;

  var canvas = document.getElementById("c");
  var ctx = P.fit(canvas, W, H);
  var sfx = P.audio();
  var input = P.input();

  if (P.isTouch) {
    document.getElementById("touch").classList.add("on");
    input.bind(document.getElementById("swing"), "fire");
  }

  P.hud({ runs: "Runs", wickets: "Wickets", balls: "Balls", streak: "Boundary" });

  // Pitch geometry: bowler runs in from top, batsman stands lower-right,
  // wicketkeeper crouches behind the stumps. Everything is drawn in this
  // shared coordinate space so the ball's flight and the fielders line up.
  var BOWLER = { x: W * 0.2, y: 52 };
  var STUMPS = { x: W * 0.72, y: H * 0.58 };
  var KEEPER = { x: W * 0.86, y: H * 0.66 };
  var BOUNDARY_R = 205;
  var FIELDERS = [
    { a: -0.9, r: 0.92 }, { a: -0.35, r: 0.96 }, { a: 0.25, r: 0.9 },
    { a: 0.85, r: 0.94 }, { a: 1.6, r: 0.88 }, { a: -2.1, r: 0.9 }
  ].map(function (f) {
    return { x: STUMPS.x + Math.cos(f.a) * BOUNDARY_R * f.r, y: STUMPS.y + Math.sin(f.a) * BOUNDARY_R * f.r };
  });

  var state, ball, batAngle, swingT, resultFlash, flashT, stumpsBroken, bailT;
  var flight; // active post-contact ball animation, or null
  var runs, wickets, balls, streak, sixes, fours, bestStreak;
  var running, deliverySpeed, pitchTarget;
  var pointerSwing = false;

  canvas.addEventListener("pointerdown", function () { pointerSwing = true; });

  function reset() {
    runs = 0; wickets = 0; balls = 0; streak = 0; sixes = 0; fours = 0; bestStreak = 0;
    batAngle = -0.55; swingT = 0; resultFlash = ""; flashT = 0;
    stumpsBroken = false; bailT = 0; flight = null;
    running = true;
    deliverySpeed = 1;
    nextDelivery();
    syncHUD();
  }

  function syncHUD() {
    P.set({
      runs: String(runs),
      wickets: wickets + "/3",
      balls: String(balls),
      streak: String(streak)
    });
  }

  function nextDelivery() {
    state = "bowl";
    pitchTarget = P.rand(0.28, 0.72);
    ball = {
      x: BOWLER.x, y: BOWLER.y, t: 0,
      speed: 0.72 + deliverySpeed * 0.08 + Math.random() * 0.06,
      swung: false
    };
    batAngle = -0.55;
    swingT = 0;
  }

  function swing() {
    if (!running || state !== "bowl" || ball.swung) return;
    ball.swung = true;
    swingT = 0.22;
    var timing = ball.t;
    var err = Math.abs(timing - 0.85);
    var outcome;

    if (timing < 0.55) {
      outcome = "miss";
    } else if (err < 0.035) {
      outcome = "six";
    } else if (err < 0.07) {
      outcome = "four";
    } else if (err < 0.12) {
      outcome = Math.random() < 0.55 ? "two" : "one";
    } else if (err < 0.18) {
      outcome = Math.random() < 0.45 ? "one" : "out";
    } else {
      outcome = Math.random() < 0.35 ? "one" : "out";
    }

    resolve(outcome);
  }

  /**
   * Every outcome gets a visible ball flight before the next delivery —
   * this is the piece that was missing entirely before: the ball used to
   * just vanish the instant you swung.
   */
  function startFlight(outcome) {
    var contact = { x: STUMPS.x - 14, y: STUMPS.y - 6 };
    var shotAngle = (pitchTarget - 0.5) * 1.4 + P.rand(-0.15, 0.15);

    if (outcome === "six") {
      var a6 = -0.55 + shotAngle;
      flight = {
        kind: "hit", dur: 1.05, t: 0,
        from: contact,
        to: { x: contact.x + Math.cos(a6) * BOUNDARY_R * 1.9, y: contact.y + Math.sin(a6) * BOUNDARY_R * 1.9 },
        arcHeight: 150, trail: []
      };
    } else if (outcome === "four") {
      var a4 = -0.15 + shotAngle;
      flight = {
        kind: "hit", dur: 0.85, t: 0,
        from: contact,
        to: { x: contact.x + Math.cos(a4) * BOUNDARY_R * 1.05, y: contact.y + Math.sin(a4) * BOUNDARY_R * 1.05 },
        arcHeight: 26, trail: []
      };
    } else if (outcome === "two" || outcome === "one") {
      var short = FIELDERS[(Math.random() * FIELDERS.length) | 0];
      flight = {
        kind: "hit", dur: 0.6, t: 0,
        from: contact,
        to: { x: P.lerp(contact.x, short.x, 0.5), y: P.lerp(contact.y, short.y, 0.5) },
        arcHeight: 14, trail: []
      };
    } else if (outcome === "out") {
      var catcher = FIELDERS[(Math.random() * FIELDERS.length) | 0];
      flight = {
        kind: "catch", dur: 0.7, t: 0,
        from: contact, to: { x: catcher.x, y: catcher.y },
        arcHeight: 60, trail: [], catcher: catcher
      };
    } else if (outcome === "miss") {
      flight = {
        kind: "keeper", dur: 0.32, t: 0,
        from: { x: STUMPS.x + 10, y: STUMPS.y - 8 }, to: { x: KEEPER.x, y: KEEPER.y },
        arcHeight: 4, trail: []
      };
    } else if (outcome === "bowled") {
      // The ball is already almost at the stumps by the time either trigger
      // fires (a late/missed swing, or beating the bat outright) -- continue
      // from where it actually is rather than an assumed contact point.
      flight = {
        kind: "bowled", dur: 0.18, t: 0,
        from: { x: ball.x, y: ball.y }, to: { x: STUMPS.x, y: STUMPS.y - 18 },
        arcHeight: 0, trail: []
      };
    }
  }

  function resolve(outcome) {
    balls++;
    var delay = 1.1;

    if (outcome === "six") {
      runs += 6; sixes++; streak++;
      if (streak > bestStreak) bestStreak = streak;
      resultFlash = "SIX!"; flashT = 1.1;
      sfx.play(880, 0.12, "triangle", 0.06);
      sfx.play(1320, 0.08, "square", 0.04);
      if (sixes >= 5) P.achieve("sixes-5", "Sky High", "Hit five sixes in one innings");
      if (streak >= 4) P.achieve("boundary-4", "Boundary Machine", "Four boundaries in a row");
    } else if (outcome === "four") {
      runs += 4; fours++; streak++;
      if (streak > bestStreak) bestStreak = streak;
      resultFlash = "FOUR"; flashT = 0.95;
      sfx.play(740, 0.1, "triangle", 0.05);
      if (streak >= 4) P.achieve("boundary-4", "Boundary Machine", "Four boundaries in a row");
    } else if (outcome === "two") {
      runs += 2; streak = 0;
      resultFlash = "2 RUNS"; flashT = 0.7;
      sfx.play(520, 0.06, "sine", 0.04);
    } else if (outcome === "one") {
      runs += 1; streak = 0;
      resultFlash = "1 RUN"; flashT = 0.65;
      sfx.play(440, 0.05, "sine", 0.035);
    } else if (outcome === "miss") {
      streak = 0;
      if (ball.t > 0.92 && Math.random() < 0.4) {
        outcome = "bowled";
        wickets++;
        resultFlash = "BOWLED!";
        flashT = 1.2;
        sfx.play(140, 0.25, "sawtooth", 0.06);
      } else {
        resultFlash = "DOT";
        flashT = 0.6;
        sfx.play(200, 0.08, "triangle", 0.03);
      }
    } else if (outcome === "bowled_direct") {
      outcome = "bowled";
      wickets++; streak = 0;
      resultFlash = "BOWLED!";
      flashT = 1.2;
      sfx.play(140, 0.25, "sawtooth", 0.06);
    } else {
      wickets++; streak = 0;
      resultFlash = "OUT!";
      flashT = 1.2;
      sfx.play(120, 0.28, "sawtooth", 0.06);
    }

    if (runs >= 50) P.achieve("fifty", "Half Century", "Score 50 runs in one innings");

    state = "flight";
    startFlight(outcome);
    syncHUD();

    setTimeout(function () {
      if (!running) return;
      if (wickets >= 3) { endInnings(); return; }
      deliverySpeed = Math.min(3.2, 1 + balls * 0.045);
      nextDelivery();
    }, delay * 1000);
  }

  function autoBowl() {
    if (ball.swung) return;
    ball.swung = true;
    resolve("bowled_direct");
  }

  function endInnings() {
    running = false;
    loop.stop();
    var res = P.run(runs, { balls: balls, sixes: sixes, fours: fours, streak: bestStreak });
    document.querySelector("#overlay .pp-title").textContent = "Innings over";
    document.getElementById("msg").textContent = res.isBest
      ? "New personal best innings."
      : "Best so far: " + P.commas(res.best) + " runs.";
    document.getElementById("finalStats").innerHTML =
      '<div class="pp-stats">' +
      stat("Runs", runs) + stat("Balls", balls) + stat("Sixes", sixes) +
      stat("Fours", fours) + stat("Best", P.commas(res.best)) +
      "</div>";
    document.getElementById("go").textContent = "Bat again";
    document.getElementById("overlay").hidden = false;
  }

  function stat(l, v) {
    return '<div><span>' + l + '</span><b>' + v + '</b></div>';
  }

  function step(dt) {
    if (!running) return;

    if (input.pressed("fire") || pointerSwing) {
      pointerSwing = false;
      swing();
    }

    if (flashT > 0) flashT -= dt;
    if (bailT > 0) bailT -= dt;

    if (state === "bowl" && ball) {
      ball.t += ball.speed * dt;
      var t = P.clamp(ball.t, 0, 1.15);
      var lift = Math.sin(Math.min(t, 1) * Math.PI) * (55 - deliverySpeed * 6);
      ball.x = P.lerp(BOWLER.x, STUMPS.x, Math.min(t, 1));
      ball.y = P.lerp(BOWLER.y, STUMPS.y, Math.min(t, 1)) - lift;
      ball.x += (pitchTarget - 0.5) * 40 * Math.min(t, 1);

      if (swingT > 0) {
        swingT -= dt;
        batAngle = P.lerp(-0.55, 0.85, 1 - swingT / 0.22);
      }

      if (t >= 1.05 && !ball.swung) autoBowl();
    } else if (state === "flight" && flight) {
      flight.t += dt / flight.dur;
      var ft = Math.min(1, flight.t);
      var fx = P.lerp(flight.from.x, flight.to.x, ft);
      var fy = P.lerp(flight.from.y, flight.to.y, ft) - Math.sin(ft * Math.PI) * flight.arcHeight;
      flight.trail.push({ x: fx, y: fy, a: 1 });
      if (flight.trail.length > 10) flight.trail.shift();
      flight.cx = fx; flight.cy = fy;

      if (flight.kind === "bowled" && ft >= 0.85 && !stumpsBroken) {
        stumpsBroken = true;
        bailT = 1;
      }
      if (ft >= 1) {
        if (flight.kind === "bowled") { flight = null; state = "done"; }
        else if (flight.t > 1.15) { flight = null; state = "done"; }
      }
    }
  }

  function drawPitch() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#6fbf4a");
    g.addColorStop(1, "#3d8a2a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Boundary rope
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.ellipse(STUMPS.x, STUMPS.y, BOUNDARY_R * 1.05, BOUNDARY_R * 0.62, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Pitch strip
    ctx.fillStyle = "#c9b07a";
    ctx.beginPath();
    ctx.moveTo(W * 0.34, 60);
    ctx.lineTo(W * 0.66, 60);
    ctx.lineTo(W * 0.78, H - 40);
    ctx.lineTo(W * 0.22, H - 40);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W * 0.38, 95); ctx.lineTo(W * 0.62, 95);
    ctx.moveTo(W * 0.28, H * 0.58); ctx.lineTo(W * 0.72, H * 0.58);
    ctx.stroke();
  }

  function drawStumps() {
    var sx = STUMPS.x, sy = STUMPS.y;
    ctx.fillStyle = "#f5f0e1";
    for (var i = -1; i <= 1; i++) {
      var kick = stumpsBroken && bailT > 0 ? Math.sin(bailT * 30) * (1.1 - bailT) * 6 : 0;
      ctx.save();
      ctx.translate(sx + i * 8, sy);
      ctx.rotate((stumpsBroken ? (1.1 - bailT) : 0) * 0.5 * i);
      ctx.fillRect(-2, -28 + kick, 4, 28);
      ctx.restore();
    }
    if (!stumpsBroken || bailT <= 0) {
      ctx.fillStyle = "#d03238";
      ctx.fillRect(sx - 12, sy - 32, 24, 3);
    } else {
      // Bails knocked off, flying away
      ctx.fillStyle = "#d03238";
      var bx = sx - 12 + (1.1 - bailT) * 26, by = sy - 34 - (1.1 - bailT) * 18;
      ctx.fillRect(bx, by, 10, 3);
    }

    ctx.fillStyle = "#f5f0e1";
    for (i = -1; i <= 1; i++) {
      ctx.fillRect(BOWLER.x + i * 7 - 2, BOWLER.y + 3, 3, 22);
    }
  }

  function drawPerson(x, y, shirt, cap) {
    ctx.fillStyle = shirt;
    ctx.beginPath();
    ctx.arc(x, y - 10, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x - 6, y - 4, 12, 20);
    if (cap) {
      ctx.fillStyle = cap;
      ctx.beginPath();
      ctx.arc(x, y - 15, 6, Math.PI, 0);
      ctx.fill();
    }
  }

  function drawBatter() {
    var bx = W * 0.68, by = H * 0.64;
    ctx.fillStyle = "#1a4d8c";
    ctx.beginPath();
    ctx.arc(bx - 18, by - 10, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(bx - 28, by - 4, 20, 34);
    ctx.fillStyle = "#054d28";
    ctx.beginPath();
    ctx.arc(bx - 18, by - 22, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(bx - 6, by + 2);
    ctx.rotate(batAngle);
    ctx.fillStyle = "#b86700";
    P.roundRect(ctx, -6, -8, 14, 58, 4);
    ctx.fill();
    ctx.fillStyle = "#8a4f00";
    ctx.fillRect(-2, -18, 6, 14);
    ctx.restore();
  }

  function drawBowler() {
    ctx.fillStyle = "#d03238";
    ctx.beginPath();
    ctx.arc(BOWLER.x, BOWLER.y - 4, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(BOWLER.x - 8, BOWLER.y + 4, 16, 26);
  }

  function drawBallSprite(x, y, elevated) {
    if (elevated) {
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.beginPath();
      ctx.ellipse(x, STUMPS.y + 10, 9, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#d03238";
    ctx.beginPath();
    ctx.arc(x, y, 7.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(x, y, 5, -0.6, 0.8);
    ctx.stroke();
  }

  function render() {
    drawPitch();

    FIELDERS.forEach(function (f, i) {
      drawPerson(f.x, f.y, i % 2 ? "#38c8ff" : "#0a3d1f", "#ffd11a");
    });

    drawStumps();
    drawBowler();
    drawPerson(KEEPER.x, KEEPER.y, "#0a3d1f", "#ffd11a");
    drawBatter();

    if (ball && state === "bowl") {
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.beginPath();
      ctx.ellipse(ball.x, H * 0.58 + 8, 10, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      drawBallSprite(ball.x, ball.y, false);

      if (ball.t > 0.65 && ball.t < 0.95 && !ball.swung) {
        ctx.strokeStyle = "rgba(255,209,26,0.7)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(STUMPS.x, STUMPS.y, 22 + Math.sin(ball.t * 40) * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    if (state === "flight" && flight) {
      for (var i = 0; i < flight.trail.length; i++) {
        var tp = flight.trail[i];
        ctx.globalAlpha = (i / flight.trail.length) * 0.4;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      drawBallSprite(flight.cx, flight.cy, flight.arcHeight > 0);
      if (flight.kind === "catch" && flight.t > 0.9) {
        ctx.fillStyle = "#ffd11a";
        ctx.font = "800 13px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("CAUGHT", flight.catcher.x, flight.catcher.y - 20);
        ctx.textAlign = "left";
      }
    }

    if (flashT > 0 && resultFlash) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, flashT * 2);
      ctx.fillStyle = resultFlash.indexOf("SIX") >= 0 || resultFlash.indexOf("FOUR") >= 0
        ? "#ffd11a" : resultFlash.indexOf("OUT") >= 0 || resultFlash.indexOf("BOWL") >= 0
        ? "#d03238" : "#ffffff";
      ctx.font = "900 42px system-ui,sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(resultFlash, W / 2, H * 0.22);
      ctx.restore();
    }
  }

  var loop = P.loop(step, render);

  document.getElementById("go").addEventListener("click", function () {
    document.getElementById("overlay").hidden = true;
    reset();
    loop.start();
  });
})();
</script>
</body>
</html>
