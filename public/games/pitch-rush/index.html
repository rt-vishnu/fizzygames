<!doctype html>
<html lang="en" data-game="pitch-rush">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Pitch Rush</title>
<link rel="stylesheet" href="../_shared/arcade.css" />
<style>
  :root { --g1: #38c8ff; --g2: #2ead4b; }
  .pp-stage canvas { box-shadow: 0 12px 40px rgba(14, 15, 12, .10); }
</style>
</head>
<body>
<div class="pp-stage"><canvas id="c"></canvas></div>

<div class="pp-touch" id="touch">
  <div class="cluster"><button id="tl">◀</button><button id="tu">▲</button><button id="td">▼</button><button id="tr">▶</button></div>
  <div class="cluster"><button id="kick">Kick</button></div>
</div>

<div class="pp-overlay" id="overlay">
  <div>
    <h1 class="pp-title">Pitch Rush</h1>
    <p class="pp-sub" id="msg">60 seconds on the pitch. Dribble past defenders, shoot, beat the keeper.</p>
    <p class="pp-sub">
      <span class="pp-kbd">WASD</span>/<span class="pp-kbd">arrows</span> move ·
      <span class="pp-kbd">space</span> kick · pass to your teammate near goal
    </p>
    <div id="finalStats"></div>
    <p></p>
    <button class="pp-btn" id="go">Kick off</button>
  </div>
</div>

<script src="../_shared/playpit.js"></script>
<script>
(function () {
  "use strict";
  var P = window.Playpit;
  var W = 720, H = 480;

  var canvas = document.getElementById("c");
  var ctx = P.fit(canvas, W, H);
  var sfx = P.audio();
  var input = P.input();

  if (P.isTouch) {
    document.getElementById("touch").classList.add("on");
    input.bind(document.getElementById("tl"), "left");
    input.bind(document.getElementById("tr"), "right");
    input.bind(document.getElementById("tu"), "up");
    input.bind(document.getElementById("td"), "down");
    input.bind(document.getElementById("kick"), "fire");
  }

  P.hud({ goals: "Goals", time: "Time", shots: "Shots", possession: "Ball" });

  var FIELD = { x: 30, y: 30, w: W - 60, h: H - 60 };
  var GOAL_TOP = H / 2 - 56, GOAL_BOT = H / 2 + 56, GOAL_X = FIELD.x + FIELD.w - 6;

  var player, teammate, keeper, defenders, ball, particles;
  var goals, shots, timeLeft, running, freezeT, possession, tackleFlash;

  function reset() {
    player = { x: W * 0.22, y: H * 0.55, r: 13, speed: 220, kickCd: 0 };
    teammate = { x: W * 0.42, y: H * 0.28, r: 12, speed: 90, roamT: 0 };
    keeper = { x: GOAL_X - 12, y: H / 2, r: 15 };

    // Two defenders hold a rough back line and shift toward the ball --
    // there is now something on the pitch to actually get past, which is
    // the whole thing that was missing before.
    defenders = [
      { x: W * 0.5, y: H * 0.36, r: 13, speed: 128, home: { x: W * 0.5, y: H * 0.36 } },
      { x: W * 0.58, y: H * 0.68, r: 13, speed: 128, home: { x: W * 0.58, y: H * 0.68 } }
    ];

    ball = { x: player.x + 18, y: player.y, r: 8, vx: 0, vy: 0, free: false, owner: "player" };
    particles = [];
    goals = 0; shots = 0; timeLeft = 60; freezeT = 0; possession = true; tackleFlash = 0;
    running = true;
    syncHUD();
  }

  function syncHUD() {
    P.set({
      goals: String(goals),
      time: Math.ceil(timeLeft) + "s",
      shots: String(shots),
      possession: possession ? "You" : (ball.owner === "teammate" ? "Teammate" : "Loose")
    });
  }

  function aimVector() {
    var dx = 1, dy = 0;
    if (input.down("up")) dy -= 1;
    if (input.down("down")) dy += 1;
    if (input.down("left")) dx -= 0.35;
    if (input.down("right")) dx += 1;
    var len = Math.hypot(dx, dy) || 1;
    return { x: dx / len, y: dy / len };
  }

  function kick() {
    if (!running || freezeT > 0 || player.kickCd > 0) return;
    if (!possession) return;
    player.kickCd = 0.25;

    var v = aimVector();
    // Passing: aiming roughly at the teammate while close enough counts as
    // a pass instead of a shot, so there is a reason to use the teammate.
    var toMate = Math.hypot(teammate.x - player.x, teammate.y - player.y);
    var aimedAtMate = (v.x * (teammate.x - player.x) + v.y * (teammate.y - player.y)) / (toMate || 1) > 0.75;

    ball.free = true;
    possession = false;
    if (aimedAtMate && toMate < 260) {
      var pdx = teammate.x - ball.x, pdy = teammate.y - ball.y;
      var plen = Math.hypot(pdx, pdy) || 1;
      ball.vx = (pdx / plen) * 300;
      ball.vy = (pdy / plen) * 300;
      ball.owner = "teammate";
      sfx.play(420, 0.05, "triangle", 0.03);
    } else {
      ball.vx = v.x * P.rand(360, 460);
      ball.vy = v.y * P.rand(260, 360);
      ball.owner = null;
      shots++;
      sfx.play(300, 0.07, "square", 0.045);
    }
    syncHUD();
  }

  function scoreGoal(byTeammate) {
    goals++;
    freezeT = 0.9;
    sfx.play(700, 0.1, "triangle", 0.05);
    sfx.play(980, 0.12, "square", 0.04);
    P.toast("⚽", byTeammate ? "Assist finished!" : "Goal!", goals + " so far");
    if (goals >= 3) P.achieve("goals-3", "Match Winner", "Score 3 goals in one match");
    if (goals >= 5) P.achieve("goals-5", "Hat-trick Plus", "Score 5 goals in one match");
    for (var i = 0; i < 18; i++) {
      particles.push({
        x: GOAL_X, y: H / 2, vx: P.rand(-220, -40), vy: P.rand(-180, 180),
        life: P.rand(0.4, 0.9), max: 0.9
      });
    }
    player.x = W * 0.22; player.y = H * 0.55;
    teammate.x = W * 0.42; teammate.y = H * 0.28;
    ball.x = player.x + 18; ball.y = player.y;
    ball.vx = 0; ball.vy = 0; ball.free = false; ball.owner = "player"; possession = true;
    keeper.y = H / 2;
    defenders.forEach(function (d) { d.x = d.home.x; d.y = d.home.y; });
    syncHUD();
  }

  function endMatch() {
    running = false;
    loop.stop();
    var score = goals * 1000 + shots * 5 + Math.round(timeLeft) * 2;
    var res = P.run(score, { goals: goals, shots: shots });
    document.querySelector("#overlay .pp-title").textContent = "Full time";
    document.getElementById("msg").textContent = res.isBest
      ? "New personal best match." : "Best so far: " + P.commas(res.best) + ".";
    document.getElementById("finalStats").innerHTML =
      '<div class="pp-stats">' +
      '<div><span>Score</span><b>' + P.commas(score) + '</b></div>' +
      '<div><span>Goals</span><b>' + goals + '</b></div>' +
      '<div><span>Shots</span><b>' + shots + '</b></div>' +
      '<div><span>Best</span><b>' + P.commas(res.best) + '</b></div>' +
      "</div>";
    document.getElementById("go").textContent = "Rematch";
    document.getElementById("overlay").hidden = false;
  }

  function step(dt) {
    if (!running) return;

    if (freezeT > 0) { freezeT -= dt; return; }
    if (player.kickCd > 0) player.kickCd -= dt;
    if (tackleFlash > 0) tackleFlash -= dt;

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endMatch(); return; }

    if (input.pressed("fire")) kick();

    var mx = 0, my = 0;
    if (input.down("left")) mx -= 1;
    if (input.down("right")) mx += 1;
    if (input.down("up")) my -= 1;
    if (input.down("down")) my += 1;
    if (mx || my) {
      var mlen = Math.hypot(mx, my);
      player.x += (mx / mlen) * player.speed * dt;
      player.y += (my / mlen) * player.speed * dt;
    }
    player.x = P.clamp(player.x, FIELD.x + player.r, FIELD.x + FIELD.w - player.r - 70);
    player.y = P.clamp(player.y, FIELD.y + player.r, FIELD.y + FIELD.h - player.r);

    // Teammate: holds a forward-left position and drifts to support,
    // rather than standing dead still -- reads as an actual second player.
    teammate.roamT += dt;
    var mateTargetX = W * 0.55 + Math.sin(teammate.roamT * 0.6) * 40;
    var mateTargetY = H * 0.3 + Math.cos(teammate.roamT * 0.5) * 60;
    teammate.x = P.lerp(teammate.x, mateTargetX, dt * 1.2);
    teammate.y = P.lerp(teammate.y, mateTargetY, dt * 1.2);
    teammate.x = P.clamp(teammate.x, FIELD.x + teammate.r, FIELD.x + FIELD.w - teammate.r);
    teammate.y = P.clamp(teammate.y, FIELD.y + teammate.r, FIELD.y + FIELD.h - teammate.r);

    // Defenders: shift off their home spot toward whoever currently has
    // (or is nearest to) the ball, and can dispossess on contact.
    defenders.forEach(function (d) {
      var chase = ball.free ? { x: ball.x, y: ball.y } : { x: player.x, y: player.y };
      var tx = P.lerp(d.home.x, chase.x, 0.55);
      var ty = P.lerp(d.home.y, chase.y, 0.55);
      d.x = P.lerp(d.x, tx, dt * 1.8);
      d.y = P.lerp(d.y, ty, dt * 1.8);

      if (possession) {
        var ddx = player.x - d.x, ddy = player.y - d.y;
        if (ddx * ddx + ddy * ddy < (d.r + player.r + 2) * (d.r + player.r + 2)) {
          possession = false;
          ball.free = true;
          ball.owner = null;
          var away = Math.atan2(player.y - d.y, player.x - d.x) + P.rand(-0.3, 0.3);
          ball.vx = Math.cos(away) * 220;
          ball.vy = Math.sin(away) * 220;
          tackleFlash = 0.4;
          sfx.play(160, 0.1, "sawtooth", 0.03);
          syncHUD();
        }
      }
    });

    var targetKY = ball.y;
    if (!ball.free) targetKY = H / 2 + Math.sin(Date.now() / 400) * 40;
    keeper.y = P.lerp(keeper.y, targetKY, dt * 3.2);
    keeper.y = P.clamp(keeper.y, FIELD.y + 50, FIELD.y + FIELD.h - 50);

    if (possession && !ball.free) {
      ball.x = player.x + 16; ball.y = player.y;
    } else {
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      ball.vx *= Math.pow(0.985, dt * 60);
      ball.vy *= Math.pow(0.985, dt * 60);

      if (ball.x - ball.r < FIELD.x) { ball.x = FIELD.x + ball.r; ball.vx *= -0.6; }
      if (ball.y - ball.r < FIELD.y) { ball.y = FIELD.y + ball.r; ball.vy *= -0.7; }
      if (ball.y + ball.r > FIELD.y + FIELD.h) { ball.y = FIELD.y + FIELD.h - ball.r; ball.vy *= -0.7; }

      if (ball.x + ball.r >= GOAL_X) {
        if (ball.y > GOAL_TOP && ball.y < GOAL_BOT) {
          scoreGoal(ball.owner === "teammate");
        } else {
          ball.x = GOAL_X - ball.r; ball.vx *= -0.55;
        }
      }

      var kdx = ball.x - keeper.x, kdy = ball.y - keeper.y;
      if (kdx * kdx + kdy * kdy < (keeper.r + ball.r) * (keeper.r + ball.r)) {
        ball.vx = -Math.abs(ball.vx) * 0.7 - 40;
        ball.vy += (ball.y - keeper.y) * 8;
        ball.owner = null;
        sfx.play(180, 0.08, "triangle", 0.04);
      }

      // Player picks up any slow, loose ball -- including one just passed
      // to the teammate's feet, since the teammate doesn't dribble itself.
      var pdx = ball.x - player.x, pdy = ball.y - player.y;
      if (pdx * pdx + pdy * pdy < (player.r + ball.r + 4) * (player.r + ball.r + 4) &&
          Math.hypot(ball.vx, ball.vy) < 110) {
        possession = true; ball.free = false; ball.owner = "player";
        ball.vx = 0; ball.vy = 0;
        syncHUD();
      }

      if (Math.hypot(ball.vx, ball.vy) < 12 && ball.free) { ball.vx = 0; ball.vy = 0; }
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (Math.floor(timeLeft) !== Math.floor(timeLeft + dt)) syncHUD();
  }

  function drawField() {
    ctx.fillStyle = "#1f7a34";
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < 8; i++) {
      ctx.fillStyle = i % 2 ? "#1f7a34" : "#246f36";
      ctx.fillRect(FIELD.x + (FIELD.w / 8) * i, FIELD.y, FIELD.w / 8, FIELD.h);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 3;
    ctx.strokeRect(FIELD.x, FIELD.y, FIELD.w, FIELD.h);
    ctx.beginPath();
    ctx.moveTo(W / 2, FIELD.y); ctx.lineTo(W / 2, FIELD.y + FIELD.h);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 48, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeRect(FIELD.x + FIELD.w - 110, H / 2 - 90, 110, 180);
    ctx.strokeRect(FIELD.x, H / 2 - 90, 110, 180);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fillRect(GOAL_X, H / 2 - 52, 14, 104);
    ctx.strokeStyle = "#fff";
    ctx.strokeRect(GOAL_X, H / 2 - 52, 14, 104);
  }

  function drawPerson(p, shirt, isKeeper) {
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + p.r - 2, p.r * 0.8, p.r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = shirt;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(p.x - 3, p.y - 3, 3, 0, Math.PI * 2);
    ctx.arc(p.x + 4, p.y - 2, 3, 0, Math.PI * 2);
    ctx.fill();
    if (isKeeper) {
      ctx.strokeStyle = "#ffd11a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function render() {
    drawField();

    defenders.forEach(function (d) { drawPerson(d, "#d03238", false); });
    drawPerson(keeper, "#ffc091", true);
    drawPerson(teammate, "#9fe870", false);
    drawPerson(player, "#38c8ff", false);

    if (tackleFlash > 0) {
      ctx.fillStyle = "rgba(208,50,56," + Math.min(0.4, tackleFlash) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    ctx.fillStyle = "#f4f4f4";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = p.life / p.max;
      ctx.fillStyle = "#ffd11a";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  var loop = P.loop(step, render);

  document.getElementById("go").addEventListener("click", function () {
    document.getElementById("overlay").hidden = true;
    reset();
    loop.start();
  });
})();
</script>
</body>
</html>
