<!doctype html><html lang="en" data-game="orbital-heist"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital Heist</title><link rel="stylesheet" href="../_shared/expedition.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand">ORBITAL <i>HEIST</i></div><div class="metrics"><span>CONTRACT<b id="mission">01 / 12</b></span><span>CORES<b id="cores">0 / 3</b></span><span>FUEL<b id="fuel">100%</b></span><span>FLIGHT<b id="time">0.0s</b></span></div><button id="map">Contracts</button><button id="pause" aria-label="Pause flight">Ⅱ</button></header>
<main class="stage"><canvas id="field" aria-label="Orbital Heist flight planner. Use the angle and power controls below, then launch. Arrows apply limited steering thrust."></canvas></main>
<footer class="toolbar"><label>Angle <input id="angle" aria-label="Launch angle" type="range" min="-75" max="75" value="0" step="0.5"><output id="angle-value">0°</output></label><label>Power <input id="power" aria-label="Launch power" type="range" min="110" max="270" value="180" step="1"><output id="power-value">180</output></label><button class="primary" id="launch">Launch →</button><button id="retry">↶ Retry</button><button id="preview">Flight assist</button></footer>
<div class="touch-controls"><div class="pad"><button data-key="up" aria-label="Thrust up">↑</button><button data-key="left" aria-label="Thrust left">←</button><button data-key="down" aria-label="Thrust down">↓</button><button data-key="right" aria-label="Thrust right">→</button></div><div class="touch-actions"><button id="brake">Brake</button><button id="invert">Invert gravity</button></div></div>
<section class="overlay" id="overlay"><div class="sheet" id="sheet"></div></section><script src="../_shared/playpit.js"></script><script src="physics.js"></script><script src="game.js"></script></body></html>
